<script>
(function(){
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  const slow=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sp=slow?0.3:1;
  let w,h,raf,last=0,t=0,scanT=-1;
  const ZMAX=70,LANE=3.4,CAM=1.15;
  let ground=[],lights=[];

  function resize(){
    const dpr=Math.min(devicePixelRatio||1,2);
    w=innerWidth;h=innerHeight;
    c.width=w*dpr;c.height=h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ground=[];
    for(let i=0;i<650;i++)ground.push({
      x:(Math.random()-0.5)*40,z:Math.random()*ZMAX,
      a:0.15+Math.random()*0.4
    });
    lights=[];
    for(let i=0;i<26;i++)lights.push({
      x:Math.random(),a:0.25+Math.random()*0.5,ph:Math.random()*6.28,sz:0.6+Math.random()*1.2
    });
  }
  function proj(X,Z){
    const f=Math.min(w,h)*0.9,hz=h*0.5;
    const s=f/Z;
    return [w/2+X*s,hz+CAM*s,s];
  }
  function mask(x,y){
    const dx=(x-w/2)/(Math.min(w,h)*0.34),dy=(y-h*0.5)/(Math.min(w,h)*0.17);
    const d=Math.hypot(dx,dy);
    return d<1?0:Math.min(1,(d-1)*2);
  }
  function dot(X,Z,alpha,red){
    if(Z<1.2||Z>ZMAX)return;
    const [x,y,s]=proj(X,Z);
    if(y>h+4)return;
    const m=mask(x,y);
    const depth=1-Z/ZMAX;
    let a=alpha*depth*m;
    if(scanT>=0){
      const sy=h*0.5+(h-h*0.5)*scanT;
      const dd=Math.abs(y-sy);
      if(dd<18){a=Math.min(1,a+0.9*(1-dd/18));red=true;}
    }
    if(a<0.01)return;
    ctx.fillStyle=(red?'rgba(191,27,44,':'rgba(210,218,228,')+a.toFixed(3)+')';
    const r=1.1+s*0.0038;
    ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
  }
  function frame(ts){
    const dt=Math.min(40,ts-last)||16;last=ts;
    t+=dt*0.006*sp;
    const cyc=(ts*0.001*sp)%6.5;
    scanT=cyc<2.2?cyc/2.2:-1;

    ctx.clearRect(0,0,w,h);
    const hz=h*0.5,tt=ts*0.001;
    const R=Math.min(w,h)*0.26;
    const rg=ctx.createRadialGradient(w/2,hz,0,w/2,hz,R);
    rg.addColorStop(0,'rgba(150,175,210,0.16)');
    rg.addColorStop(0.7,'rgba(150,175,210,0.05)');
    rg.addColorStop(1,'rgba(150,175,210,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(w/2,hz,R,Math.PI,0);ctx.fill();
    const lg=ctx.createLinearGradient(0,0,w,0);
    lg.addColorStop(0,'rgba(200,215,235,0)');
    lg.addColorStop(0.5,'rgba(200,215,235,0.55)');
    lg.addColorStop(1,'rgba(200,215,235,0)');
    ctx.fillStyle=lg;ctx.fillRect(0,hz-0.5,w,1);
    for(const l of lights){
      const x=w*(0.08+l.x*0.84);
      const fl=0.7+0.3*Math.sin(tt*1.7+l.ph);
      ctx.fillStyle='rgba(220,230,245,'+(l.a*fl).toFixed(3)+')';
      ctx.beginPath();ctx.arc(x,hz-2,l.sz,0,6.283);ctx.fill();
    }

    for(const p of ground){
      const z=((p.z-t)%ZMAX+ZMAX)%ZMAX;
      dot(p.x,z,p.a,false);
    }
    for(let i=0;i<90;i++){
      const z=((i*0.8-t)%ZMAX+ZMAX)%ZMAX;
      dot(-LANE,z,0.85,false);dot(LANE,z,0.85,false);
    }
    for(let i=0;i<40;i++){
      const z=((i*1.8-t)%ZMAX+ZMAX)%ZMAX;
      for(let k=0;k<3;k++)dot(0,z+k*0.22,0.6,false);
    }
    raf=requestAnimationFrame(frame);
  }
  addEventListener('resize',resize,{passive:true});
  resize();
  raf=requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',()=>{
    cancelAnimationFrame(raf);
    if(!document.hidden){last=0;raf=requestAnimationFrame(frame);}
  });
})();
</script>
