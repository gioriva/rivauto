    position:fixed;inset:0;display:grid;place-items:center;

    width:min(46vw,480px);height:auto;display:block;
    filter:drop-shadow(0 0 28px rgba(11,16,22,.95));

  .k{fill:var(--ink)}

<script>
(function(){
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,t=0,raf;

  const P=(1+Math.sqrt(5))/2,V=[];
  [[0,1,P],[0,1,-P],[0,-1,P],[0,-1,-P]].forEach(v=>{
    V.push(v,[v[1],v[2],v[0]],[v[2],v[0],v[1]]);
  });
  const E=[];
  for(let i=0;i<12;i++)for(let j=i+1;j<12;j++){
    const d=Math.hypot(V[i][0]-V[j][0],V[i][1]-V[j][1],V[i][2]-V[j][2]);
    if(Math.abs(d-2)<1e-6)E.push([i,j]);
  }

  function resize(){
    const dpr=Math.min(devicePixelRatio||1,2);
    w=innerWidth;h=innerHeight;
    c.width=w*dpr;c.height=h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }

  function rot(v,a,b){
    let [x,y,z]=v;
    let ca=Math.cos(a),sa=Math.sin(a);
    [x,z]=[x*ca-z*sa,x*sa+z*ca];
    let cb=Math.cos(b),sb=Math.sin(b);
    [y,z]=[y*cb-z*sb,y*sb+z*cb];
    return [x,y,z];
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    const cx=w/2,cy=h/2,f=Math.min(w,h)*0.9;

    const camY=1.4,zScroll=(t*1.2)%1;
    ctx.lineWidth=1;
    for(let i=0;i<=24;i++){
      const z=i-zScroll+1;
      const s=f/(z+2);
      const y=cy+camY*s;
      const a=0.16*(1-i/24);
      ctx.strokeStyle='rgba(120,140,160,'+a+')';
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
    }
    for(let x=-14;x<=14;x++){
      const zn=1,zf=26;
      const sn=f/(zn+2),sf=f/(zf+2);
      const grad=ctx.createLinearGradient(0,cy+camY*sn,0,cy+camY*sf);
      grad.addColorStop(0,'rgba(120,140,160,0.16)');
      grad.addColorStop(1,'rgba(120,140,160,0)');
      ctx.strokeStyle=grad;
      ctx.beginPath();
      ctx.moveTo(cx+x*sn,cy+camY*sn);
      ctx.lineTo(cx+x*sf,cy+camY*sf);
      ctx.stroke();
    }

    const R=Math.min(w,h)*0.34,dist=4.5;
    const pts=V.map(v=>{
      const [x,y,z]=rot(v,t*0.35,t*0.21);
      const s=dist/(dist+z);
      return [cx+x*R*s/P,cy+y*R*s/P,z,s];
    });
    ctx.lineWidth=1;
    E.forEach(([i,j])=>{
      const a=pts[i],b=pts[j];
      const depth=(a[2]+b[2])/2/P;
      const alpha=0.10+0.28*(depth*0.5+0.5);
      ctx.strokeStyle='rgba(200,214,228,'+alpha.toFixed(3)+')';
      ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    });
    pts.forEach(p=>{
      const depth=p[2]/P;
      ctx.fillStyle='rgba(191,27,44,'+(0.35+0.55*(depth*0.5+0.5)).toFixed(3)+')';
      ctx.beginPath();ctx.arc(p[0],p[1],1.6+depth*0.8,0,6.283);ctx.fill();
    });
  }

  function loop(){t+=0.01;draw();raf=requestAnimationFrame(loop);}
  addEventListener('resize',resize,{passive:true});
  resize();
  if(!reduce)loop();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)cancelAnimationFrame(raf);else if(!reduce)loop();
  });
})();
</script>
