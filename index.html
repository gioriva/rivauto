<style>
  :root{--bg:#05070a;--ink:#EEF2F6;--accent:#BF1B2C;--dim:rgba(220,228,238,.38)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 78% 72% at 50% 60%,transparent 40%,rgba(5,7,10,.94) 100%);
  }
  .mark{
    position:fixed;inset:0;display:grid;place-items:center;
    pointer-events:none;user-select:none;transform:translateY(-16vh);
    opacity:0;animation:fade 1.8s ease .5s forwards;
  }
  .mark svg{width:min(30vw,320px);height:auto;display:block}
  @media (max-width:640px){.mark svg{width:64vw}.mark{transform:translateY(-20vh)}}
  .k{fill:var(--ink)}
  .r{fill:var(--accent)}
  .ai{font-family:"Jost",system-ui,sans-serif;font-weight:600;letter-spacing:-0.02em}
  .cursor{animation:blink 1.1s steps(1) infinite}
  .hud{
    position:fixed;left:0;right:0;bottom:clamp(18px,3vh,30px);
    text-align:center;pointer-events:none;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    opacity:0;animation:fade 1.8s ease 1s forwards;
  }
  .hud i{font-style:normal;color:var(--accent);margin:0 10px}
  @keyframes fade{to{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.mark,.hud{animation:none;opacity:1}}

<script>
(function(){
  const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TOUCH=matchMedia('(hover: none)').matches;
  const SPEED=1;

  let W,H,DPR,COLS,ROWS,XR;
  function resize(){
    const mobile=innerWidth<640;
    DPR=Math.min(devicePixelRatio||1,mobile?1.5:2);
    W=canvas.width=Math.round(innerWidth*DPR);
    H=canvas.height=Math.round(innerHeight*DPR);
    COLS=mobile?100:190;ROWS=mobile?56:78;
    XR=22*Math.max(0.45,Math.min(1,(innerWidth/innerHeight)/1.6));
  }
  resize();addEventListener('resize',resize);

  const cam={y:0.75,f:1.55};
  const K=()=>cam.f*H*0.62;
  const pointer={x:0,z:4,s:0};
  let ripple=0,lastTouch=-1e9;

  function toScene(cx,cy){
    const off=Math.max(0.02,cy/innerHeight-0.5);
    const pz=Math.min(10.4,cam.y*cam.f*0.62/off);
    pointer.z=pz-0.4;
    pointer.x=(cx-innerWidth/2)*pz/(cam.f*0.62*innerHeight);
    pointer.s=1;
  }
  addEventListener('pointermove',e=>{toScene(e.clientX,e.clientY);lastTouch=performance.now();},{passive:true});
  addEventListener('pointerdown',e=>{toScene(e.clientX,e.clientY);ripple=1;lastTouch=performance.now();},{passive:true});
  function autoPointer(t){
    if(!TOUCH||t-lastTouch<3000)return;
    const k=t*0.00022*SPEED;
    pointer.x=Math.sin(k*1.3)*(XR*0.26);
    pointer.z=2.4+(Math.sin(k*0.9+1.7)*0.5+0.5)*3.5;
    pointer.s+=(0.9-pointer.s)*0.02;
    if(Math.sin(k*0.45)>0.995&&ripple<0.05)ripple=1;
  }

  const LEVELS=16,INK=[],RED=[];
  for(let i=0;i<LEVELS;i++){
    const a=((i+1)/LEVELS).toFixed(3);
    INK.push('rgba(220,228,238,'+a+')');RED.push('rgba(191,27,44,'+a+')');
  }

  function terrain(x,z,tt){
    const road=Math.min(1,Math.max(0,(Math.abs(x)-2.6)/3.2));
    const hills=Math.sin(x*0.42+tt*0.3)*0.22
              +Math.sin(z*0.6+x*0.18-tt*1.6)*0.20
              +Math.sin((x*0.9-z)*0.35+tt*1.1)*0.14;
    const asphalt=Math.sin(z*2.2-tt*3.4+x*0.5)*0.012;
    return hills*road*road+asphalt*(1-road);
  }

  const clock=document.getElementById('clock');
  const fmt=new Intl.DateTimeFormat('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Europe/Rome'});
  clock.textContent=fmt.format(new Date());
  setInterval(()=>{clock.textContent=fmt.format(new Date());},1000);

  let lastT=0;
  function frame(t){
    const dt=Math.min(100,t-lastT);lastT=t;
    autoPointer(t);
    if(!TOUCH||t-lastTouch<3000)pointer.s*=0.97;
    ripple*=0.985;

    ctx.fillStyle='#05070a';ctx.fillRect(0,0,W,H);
    const tt=t*0.00045*SPEED,cx=W/2,cy=H/2;

    for(let r=ROWS-1;r>=0;r--){
      const z=1.0+(r/ROWS)*9;
      for(let c=0;c<COLS;c++){
        const x=((c/(COLS-1))-0.5)*XR;
        let y=terrain(x,z,tt);
        const dx=x-pointer.x,dz=z-pointer.z,d=Math.sqrt(dx*dx+dz*dz);
        y+=Math.exp(-d*d*1.6)*0.32*pointer.s;
        y+=Math.sin(d*6-t*0.008)*Math.exp(-d*0.9)*0.12*ripple;

        const pz=z+0.4,py=y-cam.y;
        const sx=cx+(x/pz)*K(),sy=cy-(py/pz)*K();
        if(sy<-10||sy>H+10||sx<-10||sx>W+10)continue;

        const depth=1-r/ROWS;
        const lift=Math.max(0,y+0.18);
        const far=Math.min(1,depth*4);
        const onRoad=Math.abs(x)<2.6?1:0;
        const a=(0.10+depth*0.42+lift*0.7+onRoad*0.08)*far;
        const size=(0.6+depth*1.2+lift*0.9)*DPR;
        if(a<0.04)continue;
        const idx=Math.min(LEVELS-1,(a*LEVELS)|0);
        ctx.fillStyle=lift>0.42?RED[idx]:INK[idx];
        ctx.fillRect(sx-size/2,sy-size/2,size,size);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
